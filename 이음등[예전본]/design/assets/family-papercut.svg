<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="t d">
  <title id="t">손으로 감싼 집과 가족</title>
  <desc id="d">종이를 오려 붙인 모양으로, 두 손이 집과 네 명의 가족을 아래에서 감싸고 있고 지붕 위에 작은 빨간 램프가 있다.</desc>
  <!-- 팔레트: 크림 #F7F2E8 · 면 #FFFDF8 · 나무 연 #EADBC3 · 나무 중 #C89B6D · 나무 진 #8A5A3B · 램프 #C8211B -->
  <!-- 종이 한 장 아래에 깔린 조각: 같은 모양을 (4,5) 옮긴 어두운 면으로 겹친 종이 느낌을 낸다(블러 없음). -->
  <defs>
    <g id="house">
      <path d="M240 78 L360 168 L360 262 Q360 270 352 270 L128 270 Q120 270 120 262 L120 168 Z"/>
    </g>
  </defs>

  <!-- 바닥 원형 종이 -->
  <ellipse cx="244" cy="312" rx="200" ry="26" fill="#C89B6D" opacity=".35"/>

  <!-- 집: 밑층(그림자 조각) -> 윗층 -->
  <use href="#house" x="5" y="6" fill="#8A5A3B" opacity=".55"/>
  <use href="#house" fill="#EADBC3"/>
  <!-- 지붕 띠 -->
  <path d="M240 78 L372 177 L350 177 L240 94 L130 177 L108 177 Z" fill="#C89B6D"/>
  <path d="M240 94 L350 177 L350 184 L240 102 L130 184 L130 177 Z" fill="#8A5A3B" opacity=".25"/>

  <!-- 굴뚝 -->
  <rect x="297" y="96" width="24" height="46" fill="#8A5A3B"/>
  <rect x="293" y="92" width="32" height="8" rx="1" fill="#C89B6D"/>

  <!-- 열린 문(어두운 면) 안에 가족 -->
  <path d="M168 270 V212 Q168 196 184 196 H296 Q312 196 312 212 V270 Z" fill="#FFFDF8"/>
  <path d="M168 270 V212 Q168 196 184 196 H296 Q312 196 312 212 V222 Q240 214 168 222 Z" fill="#8A5A3B" opacity=".12"/>

  <!-- 가족: 어른 둘, 아이 둘. 머리 원 + 몸 둥근 사다리꼴 (같은 문법) -->
  <!-- 어른 1 (왼) -->
  <circle cx="204" cy="222" r="9" fill="#8A5A3B"/>
  <path d="M190 270 V248 Q190 235 204 235 Q218 235 218 248 V270 Z" fill="#8A5A3B"/>
  <!-- 아이 1 -->
  <circle cx="228" cy="240" r="7" fill="#C89B6D"/>
  <path d="M217 270 V256 Q217 246 228 246 Q239 246 239 256 V270 Z" fill="#C89B6D"/>
  <!-- 아이 2 -->
  <circle cx="252" cy="241" r="6.5" fill="#C89B6D"/>
  <path d="M242 270 V257 Q242 247.5 252 247.5 Q262 247.5 262 257 V270 Z" fill="#C89B6D"/>
  <!-- 어른 2 (오) -->
  <circle cx="276" cy="222" r="9" fill="#8A5A3B"/>
  <path d="M262 270 V248 Q262 235 276 235 Q290 235 290 248 V270 Z" fill="#8A5A3B"/>

  <!-- 창 -->
  <rect x="136" y="186" width="22" height="22" rx="2" fill="#FFFDF8"/>
  <rect x="322" y="186" width="22" height="22" rx="2" fill="#FFFDF8"/>
  <path d="M147 186v22M136 197h22M333 186v22M322 197h22" stroke="#C89B6D" stroke-width="2.5"/>

  <!-- 램프: 지붕 꼭대기 위 -->
  <path d="M230 58 v-8 a10 10 0 0 1 20 0 v8 z" fill="#C8211B"/>
  <path d="M234.5 49 a5.5 5.5 0 0 1 4.5-5" stroke="#FFFDF8" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <rect x="226" y="58" width="28" height="7" rx="2" fill="#8A5A3B"/>
  <g stroke="#8A5A3B" stroke-width="3" stroke-linecap="round">
    <path d="M240 28v-8"/><path d="M219 34l-6-6"/><path d="M261 34l6-6"/>
  </g>

  <!-- 손: 아래에서 집을 받치고 손가락이 양옆을 감싼다. 밑층(그림자 조각) -> 윗층 -->
  <g fill="#8A5A3B" opacity=".55">
    <path d="M18 352C10 312 36 288 66 280C82 258 98 238 114 222C124 214 138 222 133 237C129 250 125 258 136 264C164 272 204 270 240 268V352Z" transform="translate(5 6)"/>
    <path d="M18 352C10 312 36 288 66 280C82 258 98 238 114 222C124 214 138 222 133 237C129 250 125 258 136 264C164 272 204 270 240 268V352Z" transform="translate(480 0) scale(-1 1) translate(5 6)"/>
  </g>
  <g fill="#C89B6D">
    <path d="M18 352C10 312 36 288 66 280C82 258 98 238 114 222C124 214 138 222 133 237C129 250 125 258 136 264C164 272 204 270 240 268V352Z"/>
    <path d="M18 352C10 312 36 288 66 280C82 258 98 238 114 222C124 214 138 222 133 237C129 250 125 258 136 264C164 272 204 270 240 268V352Z" transform="translate(480 0) scale(-1 1)"/>
  </g>
  <g stroke="#8A5A3B" stroke-width="3" stroke-linecap="round" fill="none" opacity=".6">
    <path d="M70 282C86 276 104 262 124 252M58 304C90 298 120 286 150 280"/>
    <path d="M70 282C86 276 104 262 124 252M58 304C90 298 120 286 150 280" transform="translate(480 0) scale(-1 1)"/>
  </g>
</svg>
