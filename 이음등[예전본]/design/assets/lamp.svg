<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="이음등 램프">
  <title>이음등 램프</title>
  <!-- 돔: 긴급 전용 빨강. 인라인 사용 시 CSS 변수 lamp-dome으로 덮어쓴다(상단 로고는 꺼진 색). -->
  <path d="M9 21v-6.5a7 7 0 0 1 14 0V21z" fill="var(--lamp-dome, var(--siren-600, #C8211B))"/>
  <!-- 돔 안쪽 빛 반사 -->
  <path d="M12.2 14.6a3.8 3.8 0 0 1 3-3.7" fill="none" stroke="#FFFDF8" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 받침대: currentColor (보통 wood-700 토큰) -->
  <rect x="6.5" y="21" width="19" height="3.5" rx="1" fill="currentColor"/>
  <rect x="10" y="24.5" width="12" height="3" rx="1" fill="currentColor" opacity=".78"/>
  <!-- 빛살: 16px 이하에서는 class="rays"를 display:none 으로 숨긴다 -->
  <g class="rays" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M16 3.2v1.8"/><path d="M5.2 8.2l1.4 1.2"/><path d="M26.8 8.2l-1.4 1.2"/>
  </g>
</svg>
